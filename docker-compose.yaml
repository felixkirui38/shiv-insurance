# Coolify / production compose helpers for cPanel SMTP on the same VPS.
# If your Coolify app still gets ECONNREFUSED to mail:465/587, prefer Host network
# in the Coolify UI (Application → Network → Host) and set SMTP_HOST=127.0.0.1.
#
# When using Bridge mode, extra_hosts maps mail hostnames to the Docker host gateway.

services:
  shiv-insurance:
    build: .
    restart: unless-stopped
    ports:
      - "5000:5000"
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "mail.shivinsbro.co.ke:host-gateway"
    environment:
      PORT: "5000"
      NODE_ENV: production
